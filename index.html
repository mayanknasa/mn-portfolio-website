<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Mayank Nasa — Senior Product Engineer</title>
    <meta name="title" content="Mayank Nasa — Senior Product Engineer" />
    <meta
      name="description"
      content="Senior Product Engineer specializing in React Native, React, and mobile/web architecture. Built for scale at 6thStreet — 500K+ active users across 6 GCC countries, 60+ features shipped, $390K operational savings."
    />
    <meta name="keywords" content="Mayank Nasa, Senior Product Engineer, Software Engineer, React Native, React.js, TypeScript, Mobile Architecture, Frontend Systems, Bangalore" />
    <meta name="author" content="Mayank Nasa" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0E0E0C" />

    <!-- Theme initialization (prevents flash of unstyled theme) -->
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'light' || (!stored && !prefersDark && stored !== 'dark')) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      })();
    </script>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
